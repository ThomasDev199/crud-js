<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de personas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cobalto: #2338e0;
            --cobalto-claro: #3a4ff0;
            --cobalto-oscuro: #1a2aa8;
            --papel: #f4f3ff;
            --tinta: #12143a;
            --coral: #ff5c7a;
            --menta: #7cf0c4;
            --lila: #c9c6ff;
            --sol: #ffd166;
            --gris: #5d5f88;
            --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
            --texto: "Instrument Sans", "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--cobalto);
            background-image:
                radial-gradient(circle at 12% 8%, var(--cobalto-claro) 0 180px, transparent 181px),
                radial-gradient(circle at 92% 38%, var(--cobalto-oscuro) 0 260px, transparent 261px),
                radial-gradient(circle at 70% 96%, var(--cobalto-claro) 0 200px, transparent 201px),
                radial-gradient(rgba(244, 243, 255, 0.16) 1.5px, transparent 1.6px);
            background-size: auto, auto, auto, 26px 26px;
            background-attachment: fixed;
            color: var(--tinta);
            font-family: var(--texto);
            font-size: 16px;
            line-height: 1.5;
        }

        .layout {
            max-width: 1220px;
            margin: 0 auto;
            padding: 40px 24px 72px;
            display: grid;
            grid-template-columns: 370px minmax(0, 1fr);
            column-gap: 44px;
        }

        /* ---------- Cabecera ---------- */
        .top {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 52px;
        }
        .top h1 {
            margin: 0;
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(2.6rem, 7vw, 5.4rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
            color: var(--papel);
        }
        .top h1 span { display: block; color: var(--menta); }

        .sello {
            flex: none;
            display: grid;
            place-content: center;
            width: 128px;
            height: 128px;
            border: 3px dashed var(--tinta);
            border-radius: 50%;
            background: var(--sol);
            box-shadow: 0 0 0 6px var(--sol);
            text-align: center;
            transform: rotate(10deg);
        }
        .sello strong {
            font-family: var(--display);
            font-weight: 800;
            font-size: 3.2rem;
            line-height: 1;
        }
        .sello small { font-weight: 600; font-size: 0.9rem; }

        /* ---------- Columna izquierda ---------- */
        .col-form {
            position: sticky;
            top: 24px;
            align-self: start;
        }

        .carnet {
            position: relative;
            margin: 40px 10px 40px;
            padding: 52px 24px 0;
            border-radius: 28px;
            background: var(--menta);
            box-shadow: 9px 11px 0 var(--cobalto-oscuro);
            transform: rotate(-2.5deg);
            overflow: visible;
        }
        /* cordón */
        .carnet::after {
            content: "";
            position: absolute;
            top: -52px;
            left: 50%;
            width: 34px;
            height: 70px;
            margin-left: -17px;
            background: repeating-linear-gradient(135deg, var(--coral) 0 8px, #ff8aa0 8px 16px);
            border-radius: 6px 6px 0 0;
            z-index: -1;
        }
        /* ranura */
        .carnet::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 50%;
            width: 70px;
            height: 13px;
            margin-left: -35px;
            border-radius: 8px;
            background: var(--cobalto);
            box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.3);
        }
        .carnet.sellar { animation: sellar 0.5s ease-out; }

        .carnet .avatar { width: 92px; height: 92px; font-size: 2.2rem; }
        .carnet .nombre {
            margin: 16px 0 0;
            font-family: var(--display);
            font-weight: 800;
            font-size: 1.8rem;
            line-height: 1.05;
            overflow-wrap: anywhere;
        }
        .carnet .correo { margin: 4px 0 0; overflow-wrap: anywhere; font-weight: 500; }
        .carnet .documento {
            margin: 22px 0 0;
            padding-top: 14px;
            border-top: 2px dashed var(--tinta);
            font-family: var(--display);
            font-weight: 800;
            font-size: 2.3rem;
            line-height: 1;
            letter-spacing: 0.03em;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }
        .carnet .nota { margin: 6px 0 16px; font-size: 0.85rem; }
        .barras { display: block; width: 100%; height: 44px; margin-bottom: 12px; }
        .holo {
            height: 22px;
            margin: 0 -24px;
            border-radius: 0 0 28px 28px;
            background: linear-gradient(90deg, var(--lila), var(--menta), var(--sol), #ff9fb2, var(--lila));
            border-top: 2px solid var(--tinta);
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 3px solid var(--tinta);
            border-radius: 50%;
            background: var(--sol);
            font-family: var(--display);
            font-weight: 800;
            font-size: 1rem;
            flex: none;
        }

        .formulario {
            padding: 26px;
            border-radius: 26px;
            background: var(--papel);
            box-shadow: 0 8px 0 var(--cobalto-oscuro);
        }
        .formulario h2 {
            margin: 0 0 18px;
            font-family: var(--display);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }
        .campo { margin-bottom: 16px; }
        .campo label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        .campo input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--lila);
            border-radius: 12px;
            background: #fff;
            color: var(--tinta);
            font: inherit;
        }
        .campo input:focus-visible { outline: 3px solid var(--cobalto); outline-offset: 1px; border-color: var(--cobalto); }
        .campo input.invalido { border-color: var(--coral); background: #fff5f7; }

        .mensaje {
            margin: 0 0 16px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #ffe3e8;
            color: #8a1630;
            font-weight: 500;
        }
        .mensaje:empty { display: none; }
        .acciones-form { display: flex; gap: 10px; }

        /* ---------- Botones ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 20px;
            border: 2.5px solid var(--tinta);
            border-radius: 999px;
            background: #fff;
            color: var(--tinta);
            font: inherit;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--tinta);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--tinta); }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
        .btn:focus-visible { outline: 3px solid var(--cobalto); outline-offset: 3px; }
        .btn[hidden] { display: none; }
        .btn svg { width: 17px; height: 17px; flex: none; }

        .btn-principal { flex: 1; background: var(--cobalto); border-color: var(--tinta); color: #fff; padding: 14px 20px; font-size: 1.05rem; }
        .btn-editar { background: var(--sol); }
        .btn-eliminar { background: var(--coral); }
        .btn-chico { padding: 9px 14px; font-size: 0.9rem; }

        /* ---------- Tabla ---------- */
        .col-tabla {
            padding: 22px;
            border-radius: 30px;
            background: var(--papel);
            box-shadow: 0 10px 0 var(--cobalto-oscuro);
        }
        .barra {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .barra h2 {
            margin: 0;
            font-family: var(--display);
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
        }
        .buscar {
            flex: 1 1 220px;
            max-width: 320px;
            padding: 11px 16px;
            border: 2px solid var(--lila);
            border-radius: 999px;
            background: #fff;
            font: inherit;
            color: var(--tinta);
        }
        .buscar:focus-visible { outline: 3px solid var(--cobalto); outline-offset: 1px; border-color: var(--cobalto); }

        .scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        thead th { padding: 0 16px; text-align: left; font-weight: 600; font-size: 0.9rem; color: var(--gris); }
        tbody td { padding: 16px; background: #fff; vertical-align: middle; }
        tbody td:first-child { border-radius: 18px 0 0 18px; border-left: 12px solid var(--c, var(--lila)); }
        tbody td:last-child { border-radius: 0 18px 18px 0; }
        .persona { display: flex; align-items: center; gap: 14px; min-width: 190px; }
        .persona b { display: block; font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.15; overflow-wrap: anywhere; }
        .persona span span { display: block; color: var(--gris); font-size: 0.92rem; overflow-wrap: anywhere; }
        td.doc {
            border-left: 3px dashed var(--lila);
            font-family: var(--display);
            font-weight: 800;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        td.celda-acciones { width: 1%; white-space: nowrap; }
        .acciones { display: flex; gap: 10px; justify-content: flex-end; }

        tr.nuevo td { animation: destello 1.4s ease-out; }
        tr.saliendo td { opacity: 0; transition: opacity 0.18s ease; }

        td.vacio { padding: 44px 20px; border-radius: 18px !important; border-left: 0 !important; text-align: center; color: var(--gris); }
        td.vacio strong { display: block; margin-bottom: 4px; font-family: var(--display); font-size: 1.5rem; color: var(--tinta); }

        @keyframes destello { from { background: var(--menta); } to { background: #fff; } }
        @keyframes sellar {
            0% { transform: rotate(-2.5deg) scale(1); }
            40% { transform: rotate(-5deg) scale(1.06); }
            100% { transform: rotate(-2.5deg) scale(1); }
        }

        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; padding: 28px 16px 56px; }
            .col-form { position: static; margin-bottom: 40px; }
            .sello { width: 96px; height: 96px; }
            .sello strong { font-size: 2.3rem; }
            thead { display: none; }
            table, tbody { display: block; }
            tbody tr { display: block; margin-bottom: 14px; background: #fff; border-radius: 18px; border-left: 12px solid var(--c, var(--lila)); padding: 6px; }
            tbody td { display: block; padding: 8px 12px; background: none; border: 0 !important; border-radius: 0 !important; }
            td.doc { border-top: 3px dashed var(--lila) !important; margin-top: 6px; padding-top: 12px; }
            td.celda-acciones { width: auto; }
            .acciones { justify-content: flex-start; }
            tr.nuevo { animation: destello 1.4s ease-out; }
            tr.nuevo td { animation: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="layout">
        <header class="top">
            <h1>Registro <span>de personas</span></h1>
            <div class="sello" aria-live="polite">
                <strong id="contador">0</strong>
                <small id="contadorTxt">personas</small>
            </div>
        </header>

        <section class="col-form" aria-label="Nuevo registro">
            <article class="carnet" id="carnet" aria-hidden="true">
                <div class="avatar" id="pvAvatar">?</div>
                <p class="nombre" id="pvNombre">Tu nombre</p>
                <p class="correo" id="pvCorreo">correo@ejemplo.com</p>
                <p class="documento" id="pvDoc">0000000000</p>
                <p class="nota">Número de documento</p>
                <svg class="barras" id="pvBarras" preserveAspectRatio="none" aria-hidden="true"></svg>
                <div class="holo"></div>
            </article>

            <form class="formulario" id="formulario" novalidate>
                <h2 id="tituloForm">Nueva persona</h2>
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" autocomplete="off">
                </div>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" autocomplete="off">
                </div>
                <div class="campo">
                    <label for="documento">Número de documento</label>
                    <input type="text" id="documento" inputmode="numeric" autocomplete="off">
                </div>
                <p class="mensaje" id="mensaje" role="alert"></p>
                <div class="acciones-form">
                    <button type="submit" class="btn btn-principal" id="btnAgregar">Agregar</button>
                    <button type="button" class="btn" id="btnCancelar" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="col-tabla" aria-label="Personas registradas">
            <div class="barra">
                <h2>Personas registradas</h2>
                <input type="search" class="buscar" id="buscar" placeholder="Buscar nombre, correo o documento" aria-label="Buscar">
            </div>
            <div class="scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Persona</th>
                            <th>Documento</th>
                            <th style="text-align:right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="crud.js"></script>
</body>
</html>
